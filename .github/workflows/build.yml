name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build windows --configuration Release
      - name: Test
        run: dotnet test tests/Cida.Core.Tests --configuration Release --no-build

  package:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install vpk
        run: dotnet tool install -g vpk
      - name: Package
        run: powershell -File scripts/package.ps1 -Version 0.1.${{ github.run_number }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cida-win-x64
          path: artifacts/release/**
