name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build windows --configuration Release
      - name: Test
        run: dotnet test tests/Cida.Core.Tests --configuration Release --no-build
      - name: Windows ABI tests
        run: dotnet test tests/Cida.Windows.Tests --configuration Release --no-build

  package:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161
      - name: Package
        run: pwsh -File scripts/package.ps1 -Version 0.2.0-ci.${{ github.run_number }}
      - name: Upload artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: cida-win-x64
          path: artifacts/release/**
